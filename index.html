<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><title>Control de Repostería</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fbf6f9;--sf:#fff;--tx:#34202f;--mu:#7b6a77;--ln:#ecdfe7;--ac:#b0235f;--gr:#2f7a5b;--wa:#c2410c;--ok:#e3f2ea;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d141b;--sf:#291c26;--tx:#f5e8f0;--mu:#b39fae;--ln:#40303b;--ac:#f06fa4;--gr:#6fcf9f;--wa:#fb923c;--ok:#1f3a2e}}
:root[data-theme="dark"]{--bg:#1d141b;--sf:#291c26;--tx:#f5e8f0;--mu:#b39fae;--ln:#40303b;--ac:#f06fa4;--gr:#6fcf9f;--wa:#fb923c;--ok:#1f3a2e}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 'DM Sans',system-ui,sans-serif}
header{padding:18px 16px 6px;max-width:980px;margin:auto}
.hd{display:flex;align-items:center;gap:14px}.logo{width:84px;height:84px;flex:none;object-fit:contain;background:#fff;border:1px solid var(--ln);border-radius:16px;padding:2px}
.wm{position:fixed;top:50%;left:50%;width:min(86vw,540px);transform:translate(-50%,-50%);opacity:.13;mix-blend-mode:multiply;pointer-events:none;user-select:none;z-index:0}
header,nav,main{position:relative;z-index:1}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .wm{filter:invert(1) hue-rotate(180deg);mix-blend-mode:screen;opacity:.09}}
:root[data-theme="dark"] .wm{filter:invert(1) hue-rotate(180deg);mix-blend-mode:screen;opacity:.09}
.stp{margin:0 0 12px;padding-left:20px;color:var(--mu);font-size:14px}.stp li{margin-bottom:6px}
.dg{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;margin-bottom:14px}.dg .c{margin:0}
.kp{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}.kp b{font-size:21px}
.hb{margin-bottom:10px}.hl{display:flex;justify-content:space-between;gap:8px;font-size:14px;margin-bottom:3px}
.ht{height:9px;background:var(--ln);border-radius:6px}.ht i{display:block;height:100%;background:var(--ac);border-radius:6px}.gr .ht i{background:var(--gr)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}svg text{fill:var(--mu);font:10px 'DM Sans',sans-serif}
textarea{font:12px/1.4 ui-monospace,Menlo,monospace}
h1{font:700 26px 'Fraunces',Georgia,serif;margin:0}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 16px;max-width:980px;margin:auto}
nav button{flex:none;border:1px solid var(--ln);background:var(--sf);color:var(--tx);padding:8px 14px;border-radius:20px;font:500 14px inherit;cursor:pointer}
nav button.on{background:var(--ac);border-color:var(--ac);color:#fff}
main{max-width:980px;margin:auto;padding:0 16px 40px}
.c{background:color-mix(in srgb,var(--sf) 90%,transparent);border:1px solid var(--ln);border-radius:14px;padding:16px;margin-bottom:14px}
h2{font:600 17px 'Fraunces',Georgia,serif;margin:0 0 12px}
label{display:block;font-size:13px;color:var(--mu);margin-bottom:10px}
input,select,textarea{display:block;width:100%;margin-top:4px;padding:10px;border:1px solid var(--ln);border-radius:9px;background:var(--bg);color:var(--tx);font:15px inherit}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{background:var(--ac);color:#fff;border:0;padding:11px 18px;border-radius:9px;font:700 15px inherit;cursor:pointer}
.btn.s{background:none;color:var(--ac);border:1px solid var(--ln);padding:8px 12px;font-size:13px}
.x{background:none;border:0;color:var(--mu);cursor:pointer;font-size:13px;text-decoration:underline}
.hero{background:var(--ok);border-color:transparent}
.big{font:700 40px 'Fraunces',Georgia,serif;color:var(--gr);line-height:1.1}
.mu{color:var(--mu);font-size:13px}
.row{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--ln)}
.row:first-of-type{border-top:0}
.r{text-align:right}
.bad{color:var(--wa);font-weight:700}.good{color:var(--gr);font-weight:700}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.tiles .c{margin:0}.tiles b{display:block;font-size:19px;margin-top:2px}
#t{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:9px;opacity:0;transition:opacity .2s;pointer-events:none}
#t.on{opacity:1}

<nav id="nav"></nav><main id="m"></main><div id="t" role="status"></div>
<script>
const K='reposteria_v1';
let S={ins:[],comp:[],rec:[],ven:[],pst:{},cor:[],mer:[]},tab='dash',per='mes',dp='mes';
try{const r=localStorage.getItem(K);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}sched()};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const $$=n=>'$'+Math.round(n).toLocaleString('es-CL');
const N=n=>(Math.round(n*100)/100).toLocaleString('es-CL');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const fd=s=>s.split('-').reverse().join('-');
const gi=id=>S.ins.find(i=>i.id==id),gr=id=>S.rec.find(r=>r.id==id);
const v=id=>document.getElementById(id).value;
const nv=id=>parseFloat(String(v(id)).replace(',','.'))||0;
const rcost=r=>r.ing.reduce((a,x)=>a+(gi(x.id)?gi(x.id).costo*x.cant:0),0);
function toast(m){const t=document.getElementById('t');t.textContent=m;t.className='on';setTimeout(()=>t.className='',1800)}
const card=(t,b,c)=>`<section class="c ${c||''}"><h2>${t}</h2>${b}</section>`;
const insOpts=()=>S.ins.map(i=>`<option value="${i.id}">${esc(i.nombre)} (${i.u})</option>`).join('');

function vResumen(){
 const mo=today().slice(0,7),f=x=>per=='all'||x.fecha.startsWith(mo);
 const V=S.ven.filter(f),C=S.comp.filter(f);
 const ing=V.reduce((a,x)=>a+x.precio,0),cos=V.reduce((a,x)=>a+x.costo,0),cmp=C.reduce((a,x)=>a+x.total,0),mer=S.mer.filter(f).reduce((a,x)=>a+x.costo,0);
 const inv=S.ins.reduce((a,i)=>a+Math.max(0,i.stock)*i.costo,0);
 const low=S.ins.filter(i=>i.stock<=i.min);
 const by={};V.forEach(x=>{const b=by[x.nombre]=by[x.nombre]||{q:0,po:0,i:0,g:0};x.pt?b.po+=x.q:b.q+=x.q;b.i+=x.precio;b.g+=x.precio-x.costo});
 const rows=Object.entries(by).sort((a,b)=>b[1].g-a[1].g).map(([n,b])=>`<div class="row"><div>${esc(n)}<div class="mu">${b.q?N(b.q)+' tortas':''}${b.q&&b.po?' + ':''}${b.po?N(b.po)+' porciones':''} · ${$$(b.i)}</div></div><div class="r good">${$$(b.g)}</div></div>`).join('');
 return `<div class="c" style="padding:10px"><select onchange="per=this.value;go()"><option value="mes" ${per=='mes'?'selected':''}>Este mes</option><option value="all" ${per=='all'?'selected':''}>Todo el tiempo</option></select></div>
 ${card('Ganancia',`<div class="big">${$$(ing-cos-mer)}</div><div class="mu">Ventas ${$$(ing)} menos insumos usados ${$$(cos)}${mer?` y mermas ${$$(mer)}`:''}${ing?` · margen ${Math.round((ing-cos-mer)/ing*100)}%`:''}</div>`,'hero')}
 <div class="tiles"><div class="c"><span class="mu">Ventas</span><b>${$$(ing)}</b></div><div class="c"><span class="mu">Gastado en compras</span><b>${$$(cmp)}</b></div><div class="c"><span class="mu">Insumos en bodega</span><b>${$$(inv)}</b></div><div class="c"><span class="mu">Caja (ventas − compras)</span><b class="${ing-cmp<0?'bad':''}">${$$(ing-cmp)}</b></div></div>
 ${card('Por tomar en cuenta',low.length?low.map(i=>`<div class="row"><div>${esc(i.nombre)}</div><div class="bad">${N(i.stock)} ${i.u} (mín. ${N(i.min)})</div></div>`).join(''):'<div class="mu">Todos los insumos están sobre su mínimo.</div>')}
 ${card('Ganancia por producto',rows||'<div class="mu">Aún no hay ventas en este período.</div>')}`;
}
function vIns(){
 return card('Nuevo insumo',`<label>Nombre<input id="in_n" placeholder="Harina, huevos, manjar…"></label><div class="g2"><label>Unidad<select id="in_u"><option>g</option><option>ml</option><option>un</option><option>kg</option><option>l</option></select></label><label>Stock mínimo (aviso)<input id="in_m" type="number" inputmode="decimal" value="0"></label></div><button class="btn" onclick="addIns()">Guardar insumo</button><div class="mu" style="margin-top:8px">El stock parte en 0; regístralo en Compras. Usa la misma unidad en recetas y compras.</div>`)+
 card('Inventario',S.ins.length?S.ins.map(i=>`<div class="row"><div><b>${esc(i.nombre)}</b><div class="mu">${$$(i.costo)} por ${i.u} · valor ${$$(Math.max(0,i.stock)*i.costo)}</div></div><div class="r"><span class="${i.stock<=i.min?'bad':''}">${N(i.stock)} ${i.u}</span><br><button class="x" onclick="delIns('${i.id}')">Eliminar</button></div></div>`).join(''):'<div class="mu">Agrega tu primer insumo arriba.</div>');
}
function vComp(){
 if(!S.ins.length)return card('Compras','<div class="mu">Primero crea insumos en la pestaña Insumos.</div>');
 return card('Registrar compra',`<label>Insumo<select id="c_i">${insOpts()}</select></label><div class="g2"><label>Cantidad comprada<input id="c_q" type="number" inputmode="decimal"></label><label>Costo total pagado<input id="c_t" type="number" inputmode="decimal"></label></div><label>Fecha<input id="c_d" type="date" value="${today()}"></label><button class="btn" onclick="addComp()">Guardar compra</button>`)+
 card('Historial de compras',S.comp.length?[...S.comp].sort((a,b)=>b.fecha.localeCompare(a.fecha)).map(c=>`<div class="row"><div><b>${esc(c.nombre)}</b><div class="mu">${fd(c.fecha)} · ${N(c.cant)} ${c.u}</div></div><div class="r">${$$(c.total)}<br><button class="x" onclick="delComp('${c.id}')">Eliminar</button></div></div>`).join(''):'<div class="mu">Sin compras registradas.</div>');
}
function vRec(){
 const form=S.ins.length?`<label>Nombre de la torta<input id="r_n" placeholder="Torta de chocolate 20 cm"></label><div class="g2"><label>Precio torta entera<input id="r_p" type="number" inputmode="decimal"></label><label>Porciones por torta<input id="r_s" type="number" inputmode="decimal" placeholder="Ej: 12"></label></div><label>Precio por porción (opcional)<input id="r_pp" type="number" inputmode="decimal"></label><div class="mu" style="margin-bottom:6px">Insumos que usa (por 1 torta)</div><div id="rows"></div><button class="btn s" onclick="addRow()">+ Agregar insumo</button> <button class="btn" onclick="addRec()">Guardar receta</button>`:'<div class="mu">Primero crea insumos en la pestaña Insumos.</div>';
 return card('Nueva receta',form)+card('Recetas',S.rec.length?S.rec.map(r=>{const c=rcost(r),m=r.precio-c;return `<div class="row"><div><b>${esc(r.nombre)}</b><div class="mu">${r.ing.map(x=>gi(x.id)?`${N(x.cant)} ${gi(x.id).u} ${esc(gi(x.id).nombre)}`:'').filter(Boolean).join(', ')}</div></div><div class="r">Costo ${$$(c)}<br>Precio ${$$(r.precio)}<br><span class="${m<0?'bad':'good'}">Gana ${$$(m)}</span>${r.porc>0?`<br><span class="mu">${N(r.porc)} porciones · costo ${$$(c/r.porc)} c/u${r.pp>0?' · vende '+$$(r.pp):''}</span>`:''}<br><button class="x" onclick="delRec('${r.id}')">Eliminar</button></div></div>`}).join(''):'<div class="mu">Sin recetas todavía.</div>');
}
function vVen(){
 if(!S.rec.length)return card('Ventas','<div class="mu">Primero crea una receta en la pestaña Recetas.</div>');
 return card('Registrar venta',`<label>Torta<select id="v_r" onchange="sug()">${S.rec.map(r=>`<option value="${r.id}">${esc(r.nombre)}</option>`).join('')}</select></label><label>Vendida como<select id="v_t" onchange="sug()"><option value="t">Torta entera</option><option value="p">Porciones</option></select></label><div class="g2"><label>Cantidad (tortas o porciones)<input id="v_q" type="number" inputmode="decimal" value="1" oninput="sug()"></label><label>Precio cobrado (total)<input id="v_p" type="number" inputmode="decimal"></label></div><div class="g2"><label>Cliente (opcional)<input id="v_c"></label><label>Fecha<input id="v_d" type="date" value="${today()}"></label></div><button class="btn" onclick="addVen()">Guardar venta</button><div class="mu" style="margin-top:8px">Al guardar se descuentan los insumos del inventario. Si vendes porciones, se toman primero de las ya cortadas (pestaña Porciones).</div>`)+

function addCor(){const r=gr(v('k_r')),n=nv('k_n');if(!r||n<=0)return toast('Revisa la cantidad de tortas');
 const uso=r.ing.map(x=>({id:x.id,cant:x.cant*n})),falta=uso.filter(x=>gi(x.id)&&gi(x.id).stock<x.cant).map(x=>gi(x.id).nombre);
 if(falta.length&&!confirm('Stock insuficiente de: '+falta.join(', ')+'. ¿Registrar igual?'))return;
 const costo=uso.reduce((a,x)=>a+(gi(x.id)?gi(x.id).costo*x.cant:0),0);uso.forEach(x=>{if(gi(x.id))gi(x.id).stock-=x.cant});
 S.pst[r.id]=(S.pst[r.id]||0)+n*r.porc;S.cor.push({id:uid(),rid:r.id,nombre:r.nombre,n,porc:n*r.porc,costo,fecha:v('k_d')||today(),uso});save();go();toast('Porciones sumadas')}
function delCor(id){const k=S.cor.find(x=>x.id==id);k.uso.forEach(u=>{if(gi(u.id))gi(u.id).stock+=u.cant});S.pst[k.rid]=(S.pst[k.rid]||0)-k.porc;S.cor=S.cor.filter(x=>x.id!=id);save();go();toast('Corte eliminado; insumos devueltos')}
function addMer(){const r=gr(v('m_r')),q=nv('m_q');if(!r||q<=0)return toast('Indica las porciones');
 S.pst[r.id]=(S.pst[r.id]||0)-q;S.mer.push({id:uid(),rid:r.id,nombre:r.nombre,q,motivo:v('m_m'),costo:q*cpp(r),fecha:v('m_d')||today()});save();go();toast('Merma guardada')}

  hoja('Recetas',['Receta','Precio torta','Porciones','Precio porcion','Costo torta','Ingredientes'],d.rec.map(function(r){var c=0,t=[];r.ing.forEach(function(x){var i=mi[x.id];if(i){c+=i.costo*x.cant;t.push(x.cant+' '+i.u+' '+i.nombre)}});return [r.nombre,r.precio,r.porc||0,r.pp||0,c,t.join(', ')]}));
  hoja('Ventas',['Fecha','Producto','Vendida como','Cantidad','Cliente','Precio cobrado','Costo','Ganancia'],d.ven.map(function(x){return [x.fecha,x.nombre,x.pt?'Porciones':'Torta entera',x.q,x.cli||'',x.precio,x.costo,x.precio-x.costo]}));
  hoja('Cortes',['Fecha','Torta','Tortas cortadas','Porciones','Costo'],d.cor.map(function(k){return [k.fecha,k.nombre,k.n,k.porc,k.costo]}));
  hoja('Mermas',['Fecha','Torta','Porciones','Motivo','Costo'],d.mer.map(function(m){return [m.fecha,m.nombre,m.q,m.motivo,m.costo]}));
  var j=JSON.stringify(d),b=ss.getSheetByName('_respaldo')||ss.insertSheet('_respaldo'),rr=[];b.clear();

function inP(f){const d=today();if(dp=='all')return true;if(dp=='mes')return f.startsWith(d.slice(0,7));if(dp=='an')return f.startsWith(d.slice(0,4));const x=new Date();x.setDate(x.getDate()-30);return f>=x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')}

function donut(a,b,na,nb){const t=a+b;if(!t)return '<div class="mu">Sin ventas en este período.</div>';const C=2*Math.PI*40;
 return `<div style="display:flex;align-items:center;gap:18px;flex-wrap:wrap"><svg width="120" height="120" viewBox="0 0 100 100" role="img" aria-label="Tortas enteras vs porciones"><circle cx="50" cy="50" r="40" fill="none" stroke="var(--gr)" stroke-width="16"/><circle cx="50" cy="50" r="40" fill="none" stroke="var(--ac)" stroke-width="16" stroke-dasharray="${a/t*C} ${C}" transform="rotate(-90 50 50)"/></svg><div><div><span class="dot" style="background:var(--ac)"></span>Tortas enteras<br><b>${$$(a)}</b> <span class="mu">${N(na)} un. · ${Math.round(a/t*100)}%</span></div><div style="margin-top:8px"><span class="dot" style="background:var(--gr)"></span>Porciones<br><b>${$$(b)}</b> <span class="mu">${N(nb)} porc. · ${Math.round(b/t*100)}%</span></div></div></div>`}
function mchart(){const d=new Date(),ms=[],nm=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
 for(let i=5;i>=0;i--){const t=new Date(d.getFullYear(),d.getMonth()-i,1);ms.push(t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0'))}
 const D=ms.map(k=>{const vv=S.ven.filter(x=>x.fecha.startsWith(k));return{k,ve:vv.reduce((a,x)=>a+x.precio,0),ga:vv.reduce((a,x)=>a+x.precio-x.costo,0)-S.mer.filter(x=>x.fecha.startsWith(k)).reduce((a,x)=>a+x.costo,0)}});
 const mx=Math.max(...D.map(x=>x.ve),1),H=110,bw=18;
 const bars=D.map((x,i)=>{const cx=12+i*53,h1=x.ve/mx*H,h2=Math.max(0,x.ga)/mx*H,l=nm[+x.k.slice(5)-1];return `<g><title>${l}: ventas ${$$(x.ve)}, ganancia ${$$(x.ga)}</title><rect x="${cx}" y="${H+8-h1}" width="${bw}" height="${h1}" rx="3" fill="var(--ac)"/><rect x="${cx+bw+3}" y="${H+8-h2}" width="${bw}" height="${h2}" rx="3" fill="var(--gr)"/><text x="${cx+bw}" y="${H+23}" text-anchor="middle">${l}</text></g>`}).join('');
 return `<svg viewBox="0 0 330 ${H+28}" width="100%" role="img" aria-label="Ventas y ganancia por mes">${bars}</svg><div class="mu"><span class="dot" style="background:var(--ac)"></span>Ventas <span class="dot" style="background:var(--gr);margin-left:10px"></span>Ganancia · escala hasta ${$$(mx)}</div>`}
function vDash(){
 const V=S.ven.filter(x=>inP(x.fecha)),C=S.comp.filter(x=>inP(x.fecha)),M=S.mer.filter(x=>inP(x.fecha));
 const sm=(a,f)=>a.reduce((t,x)=>t+f(x),0),ing=sm(V,x=>x.precio),cos=sm(V,x=>x.costo),mer=sm(M,x=>x.costo),cmp=sm(C,x=>x.total),gan=ing-cos-mer;
 const inv=sm(S.ins,i=>Math.max(0,i.stock)*i.costo),pors=Object.values(S.pst).reduce((a,x)=>a+Math.max(0,x),0),low=S.ins.filter(i=>i.stock<=i.min);
 const prod={},cli={},gas={},mot={},bod={};let ti=0,pi=0,nt=0,np=0;

 <div class="dg">${card('Ventas y ganancia, últimos 6 meses',mchart())}${card('Tortas enteras vs porciones',donut(ti,pi,nt,np))}${card('Ganancia por producto',hbar(top(prod,6),$$,'gr'))}${card('Gasto en insumos',hbar(top(gas,6),$$))}${card('Valor en bodega por insumo',hbar(top(bod,6),$$,'gr'))}${card('Mermas por motivo',hbar(top(mot,6),x=>N(x)+' porc.'))}${card('Mejores clientes',hbar(top(cli,5),$$,'gr'))}${card('Insumos por reponer',low.length?low.map(i=>`<div class="row"><div>${esc(i.nombre)}</div><div class="bad">${N(i.stock)} ${i.u} (mín. ${N(i.min)})</div></div>`).join(''):'<div class="mu">Todos los insumos están sobre su mínimo.</div>')}</div>`;

function go(t){if(t)tab=t;document.getElementById('nav').innerHTML=Object.entries(T).map(([k,a])=>`<button class="${k==tab?'on':''}" onclick="go('${k}')">${a[0]}</button>`).join('');
 document.getElementById('m').innerHTML=T[tab][1]();if(tab=='rec'&&S.ins.length)addRow();if(tab=='ven')sug()}
function sug(){const r=gr(v('v_r')),p=document.getElementById('v_p');if(r&&p){const pt=v('v_t')=='p',u=pt?(r.pp>0?r.pp:(r.porc>0?r.precio/r.porc:0)):r.precio;p.value=Math.round(u*(nv('v_q')||1))}}

function addIns(){const n=v('in_n').trim();if(!n)return toast('Escribe un nombre');S.ins.push({id:uid(),nombre:n,u:v('in_u'),min:nv('in_m'),stock:0,costo:0});save();go();toast('Insumo guardado')}
function delIns(id){if(S.rec.some(r=>r.ing.some(x=>x.id==id))||S.comp.some(c=>c.iid==id))return toast('Está en recetas o compras; no se puede eliminar');S.ins=S.ins.filter(i=>i.id!=id);save();go()}
function addComp(){const i=gi(v('c_i')),q=nv('c_q'),t=nv('c_t');if(!i||q<=0||t<=0)return toast('Completa cantidad y costo');
 const s=Math.max(0,i.stock);i.costo=(s*i.costo+t)/(s+q);i.stock+=q;S.comp.push({id:uid(),iid:i.id,nombre:i.nombre,u:i.u,cant:q,total:t,fecha:v('c_d')||today()});save();go();toast('Compra guardada')}
function delComp(id){const c=S.comp.find(x=>x.id==id),i=gi(c.iid);if(i)i.stock-=c.cant;S.comp=S.comp.filter(x=>x.id!=id);save();go()}
function addRow(){document.getElementById('rows').insertAdjacentHTML('beforeend',`<div class="g2 ing"><select>${insOpts()}</select><input type="number" inputmode="decimal" placeholder="Cantidad"></div>`)}
function addRec(){const n=v('r_n').trim(),ing=[...document.querySelectorAll('.ing')].map(d=>({id:d.children[0].value,cant:parseFloat(d.children[1].value)||0})).filter(x=>x.cant>0);
 if(!n||!ing.length)return toast('Pon nombre y al menos un insumo');S.rec.push({id:uid(),nombre:n,precio:nv('r_p'),porc:nv('r_s'),pp:nv('r_pp'),ing});save();go();toast('Receta guardada')}
function delRec(id){S.rec=S.rec.filter(r=>r.id!=id);save();go()}
function addVen(){const r=gr(v('v_r')),q=nv('v_q'),p=nv('v_p');if(!r||q<=0)return toast('Revisa la cantidad');
 const pt=v('v_t')=='p';if(pt&&!(r.porc>0))return toast('Define las porciones por torta en la receta');const tk=pt?Math.min(q,S.pst[r.id]||0):0,f=pt?(q-tk)/r.porc:q,uso=r.ing.map(x=>({id:x.id,cant:x.cant*f})),falta=uso.filter(x=>gi(x.id)&&gi(x.id).stock<x.cant).map(x=>gi(x.id).nombre);
 if(falta.length&&!confirm('Stock insuficiente de: '+falta.join(', ')+'. ¿Registrar igual?'))return;
 const costo=tk*(pt?rcost(r)/r.porc:0)+uso.reduce((a,x)=>a+(gi(x.id)?gi(x.id).costo*x.cant:0),0);if(tk)S.pst[r.id]-=tk;uso.forEach(x=>{if(gi(x.id))gi(x.id).stock-=x.cant});
 S.ven.push({id:uid(),rid:r.id,nombre:r.nombre,q,pt,tk,precio:p,costo,cli:v('v_c').trim(),fecha:v('v_d')||today(),uso});save();go();toast('Venta guardada')}
function delVen(id){const x=S.ven.find(y=>y.id==id);x.uso.forEach(u=>{if(gi(u.id))gi(u.id).stock+=u.cant});if(x.tk)S.pst[x.rid]=(S.pst[x.rid]||0)+x.tk;S.ven=S.ven.filter(y=>y.id!=id);save();go();toast('Venta eliminada; stock devuelto')}
function restore(){try{const d=JSON.parse(v('bk'));if(!d.ins||!d.ven)throw 0;S=Object.assign({ins:[],comp:[],rec:[],ven:[],pst:{},cor:[],mer:[]},d);save();go();toast('Datos restaurados')}catch(e){toast('El texto no es un respaldo válido')}}
go();
</script></body></html>
